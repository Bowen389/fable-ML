name: unified-trade-guide
on:
  workflow_dispatch:
  workflow_run:
    workflows: [daily-scan]
    types: [completed]
    branches: [main]
  push:
    paths:
      - trade_guide.py
      - guide_observations.json
      - .github/workflows/trade-guide.yml
permissions:
  contents: write
concurrency:
  group: cs2-scanner
  cancel-in-progress: false
jobs:
  guide:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate evidence-based guide
        run: python -u trade_guide.py
      - name: Save guide while preserving concurrent daily candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          backup=$(mktemp -d)
          cp output/guide_latest.md output/guide_latest.json "$backup/"
          git add output/guide_latest.md output/guide_latest.json
          if ! git diff --cached --quiet; then git commit -m "Prepare unified guide"; fi
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B publish-unified-guide FETCH_HEAD
            cp "$backup/guide_latest.md" "$backup/guide_latest.json" output/
            python - <<'PY'
          import json
          from pathlib import Path
          from coil_report_section import load_coil_snapshot,merge_coil_section
          from system_report_section import merge_system_section,load_system
          root=Path.cwd()
          p=root/'output/guide_latest.json'
          guide=json.loads(p.read_text())
          guide['coil_candidates']=load_coil_snapshot(root)
          guide['integrated_system']=load_system(root)
          p.write_text(json.dumps(guide,ensure_ascii=False,indent=2))
          p=root/'output/guide_latest.md'
          p.write_text(merge_system_section(merge_coil_section(p.read_text(),root,report_asof=guide['signal']['date']),root))
          PY
            git add output/guide_latest.md output/guide_latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update unified trading guide"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: unified-trade-guide
          path: |
            output/guide_latest.md
            output/guide_latest.json
          retention-days: 30

