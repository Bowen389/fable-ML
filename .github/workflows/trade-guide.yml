name: unified-trade-guide
on:
  workflow_dispatch:
  workflow_run:
    workflows: [daily-scan]
    types: [completed]
    branches: [main]
  push:
    paths:
      - trade_guide.py
      - guide_observations.json
      - .github/workflows/trade-guide.yml
permissions:
  contents: write
concurrency:
  group: cs2-scanner
  cancel-in-progress: false
jobs:
  guide:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate evidence-based guide
        run: python -u trade_guide.py
      - name: Save guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/guide_latest.md output/guide_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "report: update unified trading guide"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: unified-trade-guide
          path: |
            output/guide_latest.md
            output/guide_latest.json
          retention-days: 30
