name: Unified CS2 system
on:
  workflow_dispatch:
    inputs:
      collect_whale:
        description: Collect real Whale events (requires CSQAQ_TOKEN)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - pipeline_readiness.py
      - test_pipeline_readiness.py
      - decision_engine.py
      - test_decision_engine.py
      - unified_system.py
      - system_report_section.py
      - publish_unified_system.py
      - test_unified_system.py
      - integrations/**
      - .github/workflows/unified-system.yml
  workflow_run:
    workflows: [Daily accumulation watch candidates]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '47 2 * * *' # 10:47, after morning quotes and daily scores
    - cron: '7 8,14 * * *' # 16:07 and 22:07; upstream completion is checked
    - cron: '7 12 * * *'
permissions:
  contents: write
concurrency:
  group: unified-cs2-system
  cancel-in-progress: false
jobs:
  report:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Verify integration boundaries
        run: python -m unittest test_unified_system test_decision_engine test_pipeline_readiness -v
      - name: Wait for current quote slot and completed daily scores
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u pipeline_readiness.py
      - name: Refresh published daily inputs after waiting
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Build full report
        env:
          CSQAQ_TOKEN: ${{ secrets.CSQAQ_TOKEN }}
          COLLECT: ${{ github.event.inputs.collect_whale }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          args=()
          if [[ "$COLLECT" == "true" || "$CRON" == "7 12 * * *" ]]; then args+=(--collect-whale); fi
          python -u unified_system.py report "${args[@]}"
      - name: Publish reports and Whale checkpoint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u publish_unified_system.py
      - uses: actions/upload-artifact@v4
        with:
          name: unified-system
          path: |
            output/decision_latest.*
            output/system_latest.*
            output/demand_whales.*
            output/traditional_pool.csv
            output/traditional_hits.csv
            output/unified_monitor.csv
          retention-days: 30
