name: regression-checks
on:
  push:
    paths: ['cs2/**', 'run.py', 'tests/**', '.github/workflows/check.yml']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_regressions.py
      - run: python tests/mock_api.py
      - run: python -m compileall -q cs2 run.py
