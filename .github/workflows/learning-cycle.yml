name: Weekly review and isolated monthly retraining
on:
  schedule:
    - cron: '30 15 * * 0' # Sunday 23:30 Shanghai: weekly review
    - cron: '30 15 1 * *' # Month day 1, 23:30 Shanghai: candidate research
  workflow_dispatch:
    inputs:
      retrain:
        description: Train candidate in isolation (never replaces active scores)
        type: boolean
        default: false
  push:
    paths: [learning_review.py, test_learning_review.py, .github/workflows/learning-cycle.yml]
permissions:
  contents: write
concurrency:
  group: learning-cycle
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: research_cache
          key: firepulse-process-review-${{ github.run_id }}
          restore-keys: firepulse-process-v1-
      - name: Require preserved prices (no silent zero performance)
        run: test -n "$(find research_cache -name '*.json.gz' -print -quit)"
      - run: python -m unittest -v test_learning_review.py
      - name: Review immutable forward snapshots
        run: python learning_review.py
      - name: Publish weekly review only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add output/learning_review.json output/learning_review.md
          if ! git diff --cached --quiet; then
            git commit -m 'Update forward Top3 Top5 learning review'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
      - name: Install research dependencies
        if: github.event.schedule == '30 15 1 * *' || inputs.retrain == true
        run: pip install pandas==2.2.3 numpy==2.3.5 scikit-learn==1.8.0 joblib
      - name: Train candidate without changing active parameters
        if: github.event.schedule == '30 15 1 * *' || inputs.retrain == true
        env:
          DAILY_INFERENCE_ONLY: '0'
          REFRESH_PUBLIC_DATA: '0'
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          mkdir -p candidate/baseline
          cp output/process_score_validation.json output/multifactor_validation.json candidate/baseline/
          python -u process_score.py
          python verify_multifactor_causality.py
          python -u multifactor_research.py
          mkdir -p candidate/retrained
          cp output/process_score* output/multifactor* output/daily_process_scores.csv output/daily_multifactor_scores.csv candidate/retrained/
          python - <<'PY'
          import json,os
          from pathlib import Path
          Path('candidate/promotion.json').write_text(json.dumps({
            'promotion_allowed':False,'active_parameters_changed':False,
            'run_id':os.environ['GITHUB_RUN_ID'],
            'reason':'Candidate only. Historical baseline metrics and new holdout may use different dates; never compare them as proof of improvement. Require same untouched period, recent 90 days, three windows and prospective evidence before replacement.',
            'fees':'buy 0; sell 1%; no slippage'
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-cycle-${{ github.run_id }}
          path: |
            candidate
            output/learning_review.*
          retention-days: 90
