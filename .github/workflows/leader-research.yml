name: leader-stage-research
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cs2-scanner
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.3.5 pandas==2.2.3
      - name: Collect long-history public data and evaluate frozen leader systems
        run: python -u leader_research.py
      - name: Save research report and candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/leader_*
          if ! git diff --cached --quiet; then
            git commit -m "research: publish leader-stage report and candidates"
            git pull --rebase origin main
            for attempt in 1 2 3; do
              if git -c http.version=HTTP/1.1 push origin HEAD:main; then exit 0; fi
              sleep 5
              git pull --rebase origin main
            done
            exit 1
          fi
      - name: Upload research and raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leader-stage-research
          path: |
            output/leader_*
            research_cache/*.json.gz
          if-no-files-found: warn
          retention-days: 30
